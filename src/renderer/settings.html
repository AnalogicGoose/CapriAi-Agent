<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' stella:">
  <title>Stella — Control room</title>
  <link rel="stylesheet" href="styles/stella-theme.css">
  <link rel="stylesheet" href="styles/stella.css">
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body class="settings-body">
  <div class="window">
    <header class="top">
      <span class="orb" aria-hidden="true"></span>
      <div class="top__name"><strong>Stella</strong><span class="top__status"><i aria-hidden="true"></i><span id="status">Here with you</span></span></div>
      <button id="close" class="orbit-icon orbit-icon--30" type="button" aria-label="Close control room"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </header>
    <main id="content" tabindex="-1" aria-label="Control room"></main>
    <footer class="statusbar">
      <span id="notice" role="status" aria-live="polite">Changes save automatically</span>
      <button class="quit" type="button" data-action="quit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>Quit</button>
    </footer>
  </div>
  <script type="module" src="js/settings.js"></script>
</body>
</html>
